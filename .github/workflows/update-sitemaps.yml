name: Update Sitemap

on:
  schedule:
    - cron: '0 1 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-sitemap:
    runs-on: ubuntu-latest

    steps:
      - name: Generate automation app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.EBL_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.EBL_AUTOMATION_PRIVATE_KEY }}

      - name: Resolve automation app identity
        id: app-identity
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          app_user_id=$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)
          echo "name=${APP_SLUG}[bot]" >> "$GITHUB_OUTPUT"
          echo "email=${app_user_id}+${APP_SLUG}[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Puppeteer dependencies (Ubuntu 24.04-compatible)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ca-certificates \
            fonts-liberation \
            libatk-bridge2.0-0 \
            libatk1.0-0 \
            libcups2 \
            libdrm2 \
            libgbm1 \
            libnspr4 \
            libnss3 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libxss1 \
            libxtst6 \
            xdg-utils \
            wget

      - name: Install script-only dependencies in isolated dir
        run: |
          mkdir tmp-script-env
          cd tmp-script-env
          npm init -y
          npm install puppeteer fs-extra --legacy-peer-deps

      - name: Run sitemap update script
        run: node scripts/updateSitemaps.js
        env:
          NODE_PATH: tmp-script-env/node_modules

      - name: Remove temporary environment
        run: rm -rf tmp-script-env

      - name: Create Pull Request
        id: create-pull-request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          add-paths: public/sitemap
          commit-message: Update sitemap files
          committer: ${{ steps.app-identity.outputs.name }} <${{ steps.app-identity.outputs.email }}>
          author: ${{ steps.app-identity.outputs.name }} <${{ steps.app-identity.outputs.email }}>
          title: 'Automated sitemap update'
          body: 'This PR was created automatically by a GitHub Action to update sitemap files.'
          base: master
          branch: autoupdate-sitemap-${{ github.run_id }}
          delete-branch: true

      - name: Enable auto-merge for PR
        if: steps.create-pull-request.outputs.pull-request-number != ''
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ steps.app-token.outputs.token }}
          pull-request-number: ${{ steps.create-pull-request.outputs.pull-request-number }}
          merge-method: squash
