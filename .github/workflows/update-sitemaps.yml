name: Update Sitemap

on:
  schedule:
    - cron: '0 1 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-sitemap
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Install Puppeteer dependencies (Ubuntu 24.04-compatible)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ca-certificates \
            fonts-liberation \
            libatk-bridge2.0-0 \
            libatk1.0-0 \
            libcups2 \
            libdrm2 \
            libgbm1 \
            libnspr4 \
            libnss3 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libxss1 \
            libxtst6 \
            xdg-utils \
            wget

      - name: Install script-only dependencies in isolated dir
        env:
          PUPPETEER_VERSION: 24.43.1
        run: |
          FS_EXTRA_VERSION=$(node -p "require('./package.json').devDependencies['fs-extra']")
          mkdir tmp-script-env
          cd tmp-script-env
          npm init -y
          npm install --no-audit --no-fund --legacy-peer-deps \
            "puppeteer@${PUPPETEER_VERSION}" \
            "fs-extra@${FS_EXTRA_VERSION}"

      - name: Run sitemap update script
        run: node scripts/updateSitemaps.js
        env:
          NODE_PATH: tmp-script-env/node_modules

      - name: Upload crawled sitemaps
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sitemaps
          path: public/sitemap
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: crawl
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Remove the committed sitemaps
        run: rm -rf public/sitemap

      - name: Download crawled sitemaps
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sitemaps
          path: public/sitemap

      - name: Validate crawled sitemaps
        run: |
          shopt -s nullglob dotglob
          files=(public/sitemap/*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::The sitemap artifact is empty."
            exit 1
          fi
          for file in "${files[@]}"; do
            name=$(basename "$file")
            if [ -L "$file" ] || [ ! -f "$file" ] || [[ ! "$name" =~ ^sitemap[0-9]*\.xml\.gz$ ]]; then
              echo "::error::Unexpected entry in the sitemap artifact: $name"
              exit 1
            fi
            if ! gzip -t "$file"; then
              echo "::error::Corrupt gzip file in the sitemap artifact: $name"
              exit 1
            fi
          done

      - name: Generate automation app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.EBL_AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.EBL_AUTOMATION_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create Pull Request
        id: create-pull-request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          add-paths: public/sitemap
          commit-message: Update sitemap files
          sign-commits: true
          title: 'Automated sitemap update'
          body: 'This PR was created automatically by a GitHub Action to update sitemap files.'
          base: master
          branch: autoupdate-sitemap
          delete-branch: true

      - name: Enable auto-merge for PR
        if: steps.create-pull-request.outputs.pull-request-number != ''
        uses: peter-evans/enable-pull-request-automerge@a660677d5469627102a1c1e11409dd063606628d # v3.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          pull-request-number: ${{ steps.create-pull-request.outputs.pull-request-number }}
          merge-method: squash
