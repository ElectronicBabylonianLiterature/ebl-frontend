name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master, 'chore/**', 'feature/**', 'fix/**']

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install canvas build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev \
            libgif-dev \
            libjpeg-dev \
            libpango1.0-dev \
            libpixman-1-dev

      - name: Install
        id: install
        run: |
          for i in 1 2 3; do
            yarn install --dev --frozen-lockfile && exit 0
            echo "Install attempt $i failed, retrying in 10 seconds..."
            sleep 10
          done
          echo "::error::yarn install failed after 3 attempts."
          exit 1

      - name: No bluebird
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          if git grep -lE "(from|import|require(\\.resolve)?)[[:space:]]*\\(?[[:space:]]*['\"]bluebird(/[^'\"]*)?['\"]" -- src; then
            echo "::error::bluebird was removed from this project; the files above import it again."
            exit 1
          fi
          if git grep -nE '"(bluebird|@types/bluebird)"[[:space:]]*:' -- package.json; then
            echo "::error::bluebird was removed from this project; package.json depends on it again."
            exit 1
          fi

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: yarn lint

      - name: Compile
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: yarn tsc

      - name: Unit Tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        id: unit_tests
        run: yarn test:ci

      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: yarn build:ci-stable

      # Coverage is uploaded only from master pushes and PRs based on master.
      # A stacked PR is measured against its own base, so uploading it would
      # overwrite the master baseline with a partial figure. Stacked PRs
      # therefore report no coverage to qlty - check them locally with
      # `yarn test:ci`, which enforces the same thresholds from craco.config.js.
      - uses: qltysh/qlty-action/coverage@08a0a862c159eae9b9003081da6663d96efef637 # v2.3.0
        if: github.event_name == 'push' || github.base_ref == 'master'
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: coverage/lcov.info

  docker-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          build-args: |
            REACT_APP_DICTIONARY_API_URL=/api
          context: .
          file: ./Dockerfile
          push: false

  docker:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    name: ${{ matrix.name }}
    needs: [test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: docker
            dictionary_api_url: /api
            tags: |
              ebl.badw.de/ebl-frontend:master
              ebl.badw.de/ebl-frontend:master.${{ github.run_number }}
          - name: docker-test
            dictionary_api_url: /test/api
            tags: |
              ebl.badw.de/ebl-frontend:test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ebl.badw.de
          username: ${{ secrets.EBL_REGISTRY_USERNAME }}
          password: ${{ secrets.EBL_REGISTRY_PASSWORD }}

      - uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          build-args: |
            REACT_APP_AUTH0_DOMAIN=auth.ebl.lmu.de
            REACT_APP_CORRECTIONS_EMAIL=ebl-support+corrections@culture.lmu.de
            REACT_APP_INFO_EMAIL=ebl-info@culture.lmu.de
            REACT_APP_AUTH0_CLIENT_ID=${{ secrets.REACT_APP_AUTH0_CLIENT_ID }}
            REACT_APP_AUTH0_AUDIENCE=${{ secrets.REACT_APP_AUTH0_AUDIENCE }}
            REACT_APP_DICTIONARY_API_URL=${{ matrix.dictionary_api_url }}
            REACT_APP_SENTRY_DSN=${{ secrets.REACT_APP_SENTRY_DSN }}
            REACT_APP_GA_TRACKING_ID=${{ secrets.REACT_APP_GA_TRACKING_ID }}
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ matrix.tags }}
