name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master, 'chore/**', 'feature/**', 'fix/**']

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

env:
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install
        id: install
        run: |
          for i in 1 2 3; do
            yarn install --dev --frozen-lockfile && exit 0
            echo "Install attempt $i failed, retrying in 10 seconds..."
            sleep 10
          done
          echo "::error::yarn install failed after 3 attempts."
          exit 1

      - name: No bluebird
        run: |
          if git grep -lE "(from|import|require(\\.resolve)?)[[:space:]]*\\(?[[:space:]]*['\"]bluebird(/[^'\"]*)?['\"]" -- src; then
            echo "::error::bluebird was removed from this project; the files above import it again."
            exit 1
          fi
          if git grep -nE '"(bluebird|@types/bluebird)"[[:space:]]*:' -- package.json; then
            echo "::error::bluebird was removed from this project; package.json depends on it again."
            exit 1
          fi

      - name: Lint
        run: yarn lint

      - name: Compile
        run: yarn tsc

      - name: Unit Tests
        id: unit_tests
        run: yarn test:ci

      - name: Build
        run: GENERATE_SOURCEMAP=false DISABLE_ESLINT_PLUGIN=true NODE_OPTIONS=--max_old_space_size=1536 yarn build

      # Coverage is uploaded only from master pushes and PRs based on master.
      # A stacked PR is measured against its own base, so uploading it would
      # overwrite the master baseline with a partial figure. Stacked PRs
      # therefore report no coverage to qlty - check them locally with
      # `yarn test:ci`, which enforces the same thresholds from craco.config.js.
      - uses: qltysh/qlty-action/coverage@v1
        if: github.event_name == 'push' || github.base_ref == 'master'
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: coverage/lcov.info
  docker:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ebl.badw.de
          username: ${{ secrets.EBL_REGISTRY_USERNAME }}
          password: ${{ secrets.EBL_REGISTRY_PASSWORD }}

      - id: docker_build
        uses: docker/build-push-action@v5
        with:
          build-args: |
            REACT_APP_AUTH0_DOMAIN=auth.ebl.lmu.de
            REACT_APP_CORRECTIONS_EMAIL=ebl-support+corrections@culture.lmu.de
            REACT_APP_INFO_EMAIL=ebl-info@culture.lmu.de
            REACT_APP_AUTH0_CLIENT_ID=${{ secrets.REACT_APP_AUTH0_CLIENT_ID }}
            REACT_APP_AUTH0_AUDIENCE=${{ secrets.REACT_APP_AUTH0_AUDIENCE }}
            REACT_APP_DICTIONARY_API_URL=/api
            REACT_APP_SENTRY_DSN=${{ secrets.REACT_APP_SENTRY_DSN }}
            REACT_APP_GA_TRACKING_ID=${{ secrets.REACT_APP_GA_TRACKING_ID }}
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ebl.badw.de/ebl-frontend:master
            ${{format('ebl.badw.de/ebl-frontend:master.{0}', github.run_number)}}

  docker-test:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ebl.badw.de
          username: ${{ secrets.EBL_REGISTRY_USERNAME }}
          password: ${{ secrets.EBL_REGISTRY_PASSWORD }}

      - id: docker_build
        uses: docker/build-push-action@v5
        with:
          build-args: |
            REACT_APP_AUTH0_DOMAIN=auth.ebl.lmu.de
            REACT_APP_CORRECTIONS_EMAIL=ebl-support+corrections@culture.lmu.de
            REACT_APP_INFO_EMAIL=ebl-info@culture.lmu.de
            REACT_APP_AUTH0_CLIENT_ID=${{ secrets.REACT_APP_AUTH0_CLIENT_ID }}
            REACT_APP_AUTH0_AUDIENCE=${{ secrets.REACT_APP_AUTH0_AUDIENCE }}
            REACT_APP_DICTIONARY_API_URL=/test/api
            REACT_APP_SENTRY_DSN=${{ secrets.REACT_APP_SENTRY_DSN }}
            REACT_APP_GA_TRACKING_ID=${{ secrets.REACT_APP_GA_TRACKING_ID }}
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ebl.badw.de/ebl-frontend:test
